[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-games"
version = "0.1.0"
authors = [
  {name = "Ahmad Sulaeman", email = "asaeles@gmail.com"},
]
description = "Scraper for Play-to-Earn blockchain games"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "playwright",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/asaeles/blockchain-games"

[project.scripts]
blockchain-games = "blockchain_games.cli:main"
